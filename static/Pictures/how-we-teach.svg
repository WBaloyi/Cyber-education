<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" role="img" aria-labelledby="t d">
  <title id="t">Two ways to learn online</title>
  <desc id="d">A laptop playing a self-paced video lesson, next to a live instructor-led class with a lecturer and learners.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e9f0fb"/>
      <stop offset="1" stop-color="#ede7fe"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14336b"/>
      <stop offset="1" stop-color="#2453a0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#14336b" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="600" height="450" rx="28" fill="url(#bg)"/>
  <circle cx="520" cy="70" r="90" fill="#b39dfa" opacity="0.12"/>
  <circle cx="70" cy="400" r="110" fill="#2453a0" opacity="0.08"/>

  <!-- Laptop: self-paced video lesson -->
  <g filter="url(#shadow)">
    <rect x="52" y="92" width="300" height="196" rx="14" fill="#142238"/>
    <rect x="64" y="104" width="276" height="172" rx="8" fill="url(#screen)"/>
    <path d="M30 288h344l-18 24H48z" fill="#c9d7ea"/>
    <rect x="168" y="288" width="68" height="8" rx="4" fill="#aebfd6"/>
  </g>
  <!-- video player -->
  <rect x="80" y="118" width="244" height="112" rx="8" fill="#1d4486"/>
  <circle cx="202" cy="174" r="26" fill="#b39dfa"/>
  <path d="M195 161v26l21-13z" fill="#ffffff"/>
  <rect x="80" y="242" width="244" height="6" rx="3" fill="#2f5aa6"/>
  <rect x="80" y="242" width="150" height="6" rx="3" fill="#b39dfa"/>
  <circle cx="230" cy="245" r="7" fill="#ffffff"/>
  <rect x="80" y="258" width="92" height="8" rx="4" fill="#9fb8e0"/>
  <rect x="270" y="258" width="54" height="8" rx="4" fill="#9fb8e0"/>

  <!-- "Self-paced" label -->
  <g filter="url(#shadow)">
    <rect x="70" y="40" width="168" height="40" rx="20" fill="#ffffff"/>
  </g>
  <circle cx="94" cy="60" r="10" fill="none" stroke="#2453a0" stroke-width="3"/>
  <path d="M94 54v6l4 3" fill="none" stroke="#2453a0" stroke-width="3" stroke-linecap="round"/>
  <text x="112" y="66" font-family="Plus Jakarta Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="800" fill="#142238">Self-paced</text>

  <!-- Live class card: instructor-led -->
  <g filter="url(#shadow)">
    <rect x="330" y="150" width="236" height="232" rx="18" fill="#ffffff"/>
  </g>
  <!-- lecturer tile -->
  <rect x="346" y="166" width="204" height="108" rx="12" fill="#e9f0fb"/>
  <circle cx="448" cy="206" r="22" fill="#14336b"/>
  <path d="M410 274c4-26 20-40 38-40s34 14 38 40z" fill="#2453a0"/>
  <rect x="356" y="176" width="44" height="18" rx="9" fill="#e5484d"/>
  <circle cx="366" cy="185" r="4" fill="#ffffff"/>
  <text x="374" y="190" font-family="Plus Jakarta Sans, Segoe UI, Arial, sans-serif" font-size="11" font-weight="800" fill="#ffffff">LIVE</text>
  <!-- learner tiles -->
  <g>
    <rect x="346" y="284" width="62" height="52" rx="10" fill="#ede7fe"/>
    <circle cx="377" cy="303" r="10" fill="#6d4fd8"/>
    <path d="M361 336c2-12 8-18 16-18s14 6 16 18z" fill="#b39dfa"/>
    <rect x="417" y="284" width="62" height="52" rx="10" fill="#e9f0fb"/>
    <circle cx="448" cy="303" r="10" fill="#33435c"/>
    <path d="M432 336c2-12 8-18 16-18s14 6 16 18z" fill="#5f6f86"/>
    <rect x="488" y="284" width="62" height="52" rx="10" fill="#fff1db"/>
    <circle cx="519" cy="303" r="10" fill="#9a5c00"/>
    <path d="M503 336c2-12 8-18 16-18s14 6 16 18z" fill="#c47b00"/>
  </g>
  <rect x="346" y="350" width="140" height="10" rx="5" fill="#e1e8f2"/>
  <rect x="494" y="346" width="56" height="20" rx="10" fill="#2453a0"/>

  <!-- "Instructor-led" label -->
  <g filter="url(#shadow)">
    <rect x="378" y="102" width="188" height="40" rx="20" fill="#14336b"/>
  </g>
  <circle cx="402" cy="122" r="10" fill="#b39dfa"/>
  <path d="M397 122l4 4 6-8" fill="none" stroke="#14336b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="420" y="128" font-family="Plus Jakarta Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="800" fill="#ffffff">Instructor-led</text>

  <!-- certificate badge -->
  <g filter="url(#shadow)">
    <circle cx="120" cy="370" r="42" fill="#ffffff"/>
  </g>
  <circle cx="120" cy="370" r="30" fill="#b39dfa"/>
  <path d="M106 371l9 9 18-20" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="176" y="366" font-family="Plus Jakarta Sans, Segoe UI, Arial, sans-serif" font-size="16" font-weight="800" fill="#142238">Certificate</text>
  <text x="176" y="388" font-family="Plus Jakarta Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#5f6f86">on completion</text>
</svg>
