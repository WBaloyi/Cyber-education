<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="{% block description %}Learn practical, career-ready technology skills with Cyber Education.{% endblock %}">
    <title>{% block title %}Cyber Education{% endblock %}</title>
    <link rel="icon" href="/static/Pictures/Wesbsite%20icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/Style.css">
    {% block head %}{% endblock %}
</head>
<body class="bg-custom">
    <a class="skip-link" href="#main">Skip to content</a>
    <header>
        <!-- Bootstrap navbar: collapses into a menu button below the lg breakpoint -->
        <nav class="navbar navbar-expand-lg site-nav" aria-label="Main navigation">
            <a class="navbar-brand site-brand" href="{{ url_for('home') }}" aria-label="Cyber Education home">
                <img src="/static/Pictures/Website%20icon%20transparent.png" alt="Cyber Education">
            </a>
            <button class="navbar-toggler nav-toggle" type="button" data-bs-toggle="collapse" data-bs-target="#site-nav-links"
                    aria-expanded="false" aria-controls="site-nav-links" aria-label="Toggle navigation">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
                    <path class="nav-toggle-open" d="M4 7h16M4 12h16M4 17h16"></path>
                    <path class="nav-toggle-close" d="M6 6l12 12M18 6L6 18"></path>
                </svg>
                <span>Menu</span>
            </button>
            <div class="collapse navbar-collapse justify-content-lg-end" id="site-nav-links">
                <ul class="navbar-nav site-nav-links">
                    {% for endpoint, label in nav_items %}
                    <li class="nav-item"><a href="{{ url_for(endpoint) }}"
                           class="nav-link{{ ' nav-cta' if endpoint == 'contact' }}{{ ' active' if active_nav == endpoint }}"
                           {% if active_nav == endpoint %}aria-current="page"{% endif %}>{{ label }}</a></li>
                    {% endfor %}
                </ul>
            </div>
        </nav>
    </header>

    <main id="main" class="{% block main_class %}{% endblock %}">
        {% block content %}{% endblock %}
    </main>

    <footer><p class="mb-0">&copy; 2025 CyberEducation.co.za</p></footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/Java.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
